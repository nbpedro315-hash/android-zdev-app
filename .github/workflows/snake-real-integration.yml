name: Snake‑Real Integration

on:
  workflow_dispatch:

jobs:
  run-snake-real:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Python 3
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run pack script
        working-directory: snake-real
        run: |
          chmod +x pack.py
          ./pack.py
